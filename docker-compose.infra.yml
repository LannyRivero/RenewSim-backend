name: renewsim_infrastructure

services:
  db:
    image: mysql:8.0
    container_name: renewsim_db_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: renewsim_root_password
      MYSQL_DATABASE: renewsim
      MYSQL_USER: renewsim
      MYSQL_PASSWORD: renewsim_dev_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prenewal_root_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

volumes:
  db_data:
    name: renewsim_db_data
    driver: local