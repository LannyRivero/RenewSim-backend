name: renewsim_stage

services:
  db:
    image: mysql:8.0
    container_name: renewsim_stage_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${STAGE_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${STAGE_MYSQL_DATABASE:-renewsim}
      MYSQL_USER: ${STAGE_MYSQL_USER:-renewsim}
      MYSQL_PASSWORD: ${STAGE_MYSQL_PASSWORD}
    volumes:
      - stage_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${STAGE_MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - renewsim_stage_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: renewsim_stage_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: stage
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${STAGE_MYSQL_DATABASE:-renewsim}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${STAGE_MYSQL_USER:-renewsim}
      SPRING_DATASOURCE_PASSWORD: ${STAGE_MYSQL_PASSWORD}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      OPENWEATHER_BASE_URL: ${OPENWEATHER_BASE_URL:-https://api.openweathermap.org}
      SECURITY_JWT_SECRET_BASE64: ${SECURITY_JWT_SECRET_BASE64}
      SECURITY_JWT_ISSUER: ${SECURITY_JWT_ISSUER:-renewsim-auth-stage}
      SECURITY_JWT_AUDIENCE: ${SECURITY_JWT_AUDIENCE:-renewsim-app-stage}
      EMAIL_BREVO_API_KEY: ${EMAIL_BREVO_API_KEY}
      EMAIL_BREVO_SENDER_EMAIL: ${EMAIL_BREVO_SENDER_EMAIL:-noreply@renewsim.com}
      EMAIL_BREVO_SENDER_NAME: ${EMAIL_BREVO_SENDER_NAME:-RenewSim}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      APP_EMAIL_VERIFICATION_EXPIRATION_HOURS: ${APP_EMAIL_VERIFICATION_EXPIRATION_HOURS:-48}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - renewsim_stage_network

volumes:
  stage_db_data:
    name: renewsim_stage_db_data
    driver: local

networks:
  renewsim_stage_network:
    name: renewsim_stage_network
    driver: bridge
