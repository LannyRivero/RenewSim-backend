name: CI Pipeline

on:
  push:
    branches: [ main, dev/v1.2.0 ]
  pull_request:
    branches: [ main, dev/v1.2.0 ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests with Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      SPRING_PROFILES_ACTIVE: test
      JWT_SECRET: TzEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVm
      TESTCONTAINERS_RYUK_DISABLED: true
      TESTCONTAINERS_CHECKS_DISABLE: true
      MIGRATION_IT_FAIL_FAST_ON_FALLBACK: "false"
      TEST_DB_ADMIN_URL: jdbc:mysql://127.0.0.1:3306/mysql
      TEST_DB_HOSTPORT: 127.0.0.1:3306
      TEST_DB_USER: root
      TEST_DB_PASS: root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests with coverage
        run: |
          set -euo pipefail
          mvn clean test jacoco:report \
            -Dtest.db.admin.url="$TEST_DB_ADMIN_URL" \
            -Dtest.db.hostport="$TEST_DB_HOSTPORT" \
            -Dtest.db.user="$TEST_DB_USER" \
            -Dtest.db.pass="$TEST_DB_PASS" \
            -Dmigration.it.fail-fast-on-fallback="$MIGRATION_IT_FAIL_FAST_ON_FALLBACK" \
            --batch-mode --no-transfer-progress

      - name: Run scoped migration integration tests
        run: |
          set -euo pipefail
          mvn failsafe:integration-test failsafe:verify \
            -Dit.test=SimulationSchemaMigrationIT \
            -Dtest.db.admin.url="$TEST_DB_ADMIN_URL" \
            -Dtest.db.hostport="$TEST_DB_HOSTPORT" \
            -Dtest.db.user="$TEST_DB_USER" \
            -Dtest.db.pass="$TEST_DB_PASS" \
            -Dmigration.it.fail-fast-on-fallback="$MIGRATION_IT_FAIL_FAST_ON_FALLBACK" \
            --batch-mode --no-transfer-progress

      - name: Ensure simulation migration IT passed
        run: |
          set -euo pipefail
          REPORT_FILE=$(find target/failsafe-reports -name "TEST-*SimulationSchemaMigrationIT*.xml" 2>/dev/null | head -n 1 || true)

          if [ -z "${REPORT_FILE}" ]; then
            echo "::error::Missing SimulationSchemaMigrationIT report"
            exit 1
          fi

          if grep -q 'failures="[1-9]"' "${REPORT_FILE}" || grep -q 'errors="[1-9]"' "${REPORT_FILE}"; then
            echo "::error::SimulationSchemaMigrationIT did not pass"
            exit 1
          fi

          echo "SimulationSchemaMigrationIT passed"

      - name: Read migration IT mode evidence
        run: |
          set -euo pipefail
          EVIDENCE_FILE="target/verify/migration-it-mode-evidence.json"

          if [ ! -f "${EVIDENCE_FILE}" ]; then
            echo "::error::Missing migration IT mode evidence at ${EVIDENCE_FILE}"
            exit 1
          fi

          MODE=$(python3 -c "import json;print(json.load(open('${EVIDENCE_FILE}', encoding='utf-8')).get('mode',''))")
          FALLBACK_REASON=$(python3 -c "import json;print(json.load(open('${EVIDENCE_FILE}', encoding='utf-8')).get('fallbackReason',''))")
          ISOLATION_ID=$(python3 -c "import json;print(json.load(open('${EVIDENCE_FILE}', encoding='utf-8')).get('isolationId',''))")

          if [ -z "${MODE}" ]; then
            echo "::error::Migration IT mode evidence is missing required field: mode"
            exit 1
          fi

          echo "Migration IT mode evidence: mode=${MODE}, fallbackReason=${FALLBACK_REASON}, isolationId=${ISOLATION_ID}"
          echo "migration_it_mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "migration_it_fallback_reason=${FALLBACK_REASON}" >> "$GITHUB_OUTPUT"
          echo "migration_it_isolation_id=${ISOLATION_ID}" >> "$GITHUB_OUTPUT"

      - name: Enforce migration IT fail-fast fallback policy
        run: |
          set -euo pipefail
          EVIDENCE_FILE="target/verify/migration-it-mode-evidence.json"

          MODE=$(python3 -c "import json;print(json.load(open('${EVIDENCE_FILE}', encoding='utf-8')).get('mode',''))")
          FALLBACK_REASON=$(python3 -c "import json;print(json.load(open('${EVIDENCE_FILE}', encoding='utf-8')).get('fallbackReason',''))")

          if [ "${MIGRATION_IT_FAIL_FAST_ON_FALLBACK}" = "true" ] && [ "${MODE}" = "JDBC_FALLBACK" ]; then
            echo "::error title=E_MIGRATION_IT_FALLBACK_POLICY::Fail-fast policy violated (mode=${MODE}, reason=${FALLBACK_REASON})"
            exit 1
          fi

          echo "Migration IT fail-fast policy check passed (configured=${MIGRATION_IT_FAIL_FAST_ON_FALLBACK}, mode=${MODE})"

      - name: Build changed-files input for simulation coverage extractor
        run: |
          set -euo pipefail
          mkdir -p target/verify

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            git ls-files > target/verify/changed-files.txt
          else
            git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}" > target/verify/changed-files.txt
          fi

      - name: Extract simulation changed-file coverage artifact
        run: |
          set -euo pipefail
          node scripts/verify/extract-simulation-changed-coverage.mjs \
            --jacoco target/site/jacoco/jacoco.xml \
            --changed-files target/verify/changed-files.txt \
            --output target/verify/simulation-changed-file-coverage.json

      - name: Enforce safety-net baseline completeness gate
        run: |
          set -euo pipefail
          node scripts/verify/check-safety-net-baseline.mjs \
            --apply-progress sdd/harden-simulation-verification-observability/apply-progress.md

      - name: Ensure security binding test passed
        run: |
          set -euo pipefail
          REPORT_FILE=$(find target/surefire-reports -name "TEST-*SecurityRateLimitPropertiesBindingTest*.xml" 2>/dev/null || true)

          if [ -z "${REPORT_FILE}" ]; then
            echo "::error::Missing SecurityRateLimitPropertiesBindingTest report"
            exit 1
          fi

          if grep -q 'failures="[1-9]"' "${REPORT_FILE}" || grep -q 'errors="[1-9]"' "${REPORT_FILE}"; then
            echo "::error::SecurityRateLimitPropertiesBindingTest did not pass"
            exit 1
          fi

          echo "SecurityRateLimitPropertiesBindingTest passed"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/

      - name: Upload verify artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-artifacts
          path: target/verify/
