name: CI Pipeline

on:
  push:
    branches: [ main, dev/v1.2.0 ]
  pull_request:
    branches: [ main, dev/v1.2.0 ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests with Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SPRING_PROFILES_ACTIVE: test
      JWT_SECRET: TzEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVm
      TESTCONTAINERS_RYUK_DISABLED: true
      TESTCONTAINERS_CHECKS_DISABLE: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with coverage
        run: mvn clean verify jacoco:report --batch-mode --no-transfer-progress

      - name: Ensure security binding test passed
        run: |
          set -euo pipefail
          REPORT_FILE=$(ls -1 **/target/surefire-reports/TEST-*.xml | grep -E "SecurityRateLimitPropertiesBindingTest" || true)

          if [ -z "${REPORT_FILE}" ]; then
            echo "::error::Missing SecurityRateLimitPropertiesBindingTest report"
            exit 1
          fi

          if ! grep -Eq 'tests="[1-9][0-9]*".*failures="0".*errors="0"' "${REPORT_FILE}"; then
            echo "::error::SecurityRateLimitPropertiesBindingTest did not pass"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/