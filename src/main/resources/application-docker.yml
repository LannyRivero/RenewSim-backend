# =============================
# PERFIL DOCKER - Ejecución en contenedores
# Requirement: 19.1 - datasource db:3306, logging INFO
# =============================
spring:
  datasource:
    url: jdbc:mysql://db:3306/renewsim?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DATABASE_USERNAME:renewsim_user}
    password: ${DATABASE_PASSWORD:renewsim_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 3
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      keepalive-time: 150000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate  # Flyway maneja el schema
    show-sql: false
    open-in-view: false

  # =============================
  # FLYWAY (enabled en docker)
  # =============================
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    schemas: renewsim

# =============================
# SERVER
# =============================
server:
  port: 8080
  address: 0.0.0.0
  forward-headers-strategy: framework

# =============================
# LOGGING (INFO en docker)
# =============================
logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.renewsim: INFO
    org.hibernate.SQL: INFO
    org.flywaydb: INFO

# =============================
# JWT (docker)
# =============================
security:
  jwt:
    issuer: ${SECURITY_JWT_ISSUER:renewsim-auth-docker}
    audience: ${SECURITY_JWT_AUDIENCE:renewsim-app-docker}
    secret-base64: ${JWT_SECRET_BASE64}
    expiration-seconds: ${SECURITY_JWT_EXPIRATION_SECONDS:3600}
    not-before-skew-seconds: 0
    allowed-clock-skew-seconds: 60

  rate-limiting:
    enabled: true
    strategy: IP_USER
    max-attempts: 5
    window: 60s
    retry-after: 60s
    login-path: /api/v1/auth/login
    refresh-path: /api/v1/auth/refresh

# =============================
# CORS (configurable via env vars)
# =============================
cors:
  enabled: true
  allow-credentials: true
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-methods: [ "GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS" ]
  allowed-headers:
    - Authorization
    - Content-Type
    - Accept
    - Origin
    - X-Requested-With
    - X-Correlation-Id
  exposed-headers:
    - X-Correlation-Id
    - Authorization
  max-age-seconds: 3600

# =============================
# ACTUATOR (limitado en docker)
# =============================
management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

# =============================
# SERVICE URLS (docker compose)
# =============================
user-service:
  url: http://renewsim-backend:8080

role-service:
  url: http://renewsim-backend:8080

technology-service:
  url: http://renewsim-backend:8080

# =============================
# BREVO EMAIL (docker)
# =============================
email:
  brevo:
    api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:}
    sender-name: ${BREVO_SENDER_NAME:RenewSim}
