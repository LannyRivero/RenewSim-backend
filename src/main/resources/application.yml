# =============================
# RENEWSIM - CONFIGURACIÓN PRINCIPAL
# =============================
spring:
  profiles:
    active: local # Perfil por defecto (local development)
  
  threads:
    virtual:
      enabled: true # Habilitar virtual threads (Project Loom)

  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false

  cache:
    type: caffeine
    caffeine:
      spec:
        tokens: maximumSize=1000,expireAfterWrite=5m,recordStats
        roles: maximumSize=100,expireAfterWrite=30m,recordStats
        default: maximumSize=100,expireAfterWrite=10m,recordStats

# =============================
# JWT CONFIG (común a todos los perfiles)
# =============================
security:
  jwt:
    issuer: renewsim-auth
    audience: renewsim-app
    secret-base64: ${JWT_SECRET_BASE64:}
    secret: ${JWT_SECRET_PLAINTEXT:}
    expiration-seconds: 3600
    service-expiration-seconds: 300
    not-before-skew-seconds: 0
    allowed-clock-skew-seconds: 60
    refresh-expiration-seconds: 604800

  # =============================
  # RATE LIMITING (Brute-force guard)
  # =============================
  rate-limiting:
    enabled: true
    strategy: IP_USER
    max-attempts: 5
    window: 60
    block-seconds: 300
    retry-after: 60
    login-path: /api/v1/auth/login
    refresh-path: /api/v1/auth/refresh

# =============================
# AUTH SCOPES (YamlScopePolicy)
# =============================
auth:
  roleScopes:
    USER:
      - read:simulations
      - write:simulations
      - compare:simulations
      - export:simulations
      - delete:simulations
    ANALYST:
      - read:simulations
      - write:simulations
      - compare:simulations
      - export:simulations
      - delete:simulations
    ADMIN:
      - read:simulations
      - write:simulations
      - compare:simulations
      - export:simulations
      - delete:simulations
      - read:users
      - manage:users
    SERVICE_AUTH:
      - user:write
      - user:read

# =============================
# CORS CONFIG (centralizado)
# =============================
cors:
  enabled: true
  allowed-origins:
    - https://renewsim.example.com
    - http://localhost:3000
    - http://localhost:5173
    - https://localhost:5173
    - https://127.0.0.1:5173
  allowed-methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
  allowed-headers:
    ["Content-Type", "Authorization", "X-Requested-With", "X-Correlation-Id"]
  exposed-headers: ["X-Correlation-Id"]
  allow-credentials: true
  max-age-seconds: 3600

# =============================
# LOGGING (niveles base)
# =============================
logging:
  level:
    org.springframework.security: INFO
    AUTH_AUDIT: WARN
  pattern:
    level: "%5p [corr=%X{correlationId}]"

# =============================
# ACTUATOR (endpoints base)
# =============================
management:
  endpoints:
    web:
      exposure:
        include: health,info

# =============================
# RESILIENCE4J
# =============================
resilience4j:
  circuitbreaker:
    instances:
      userService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      userService:
        max-attempts: 3
        wait-duration: 500ms
  timelimiter:
    instances:
      userService:
        timeout-duration: 2s

# =============================
# ZONA HORARIA
# =============================
app:
  clock:
    zone: UTC

simulation:
  climate:
    provider: ${SIMULATION_CLIMATE_PROVIDER:openweathermap}

services:
  weather:
    url: ${OPENWEATHER_BASE_URL:https://api.openweathermap.org}
    key: ${OPENWEATHER_API_KEY:dummy-key}
    connect-timeout: ${OPENWEATHER_CONNECT_TIMEOUT:2s}
    read-timeout: ${OPENWEATHER_READ_TIMEOUT:3s}
  pvgis:
    url: ${PVGIS_BASE_URL:https://re.jrc.ec.europa.eu}

# =============================
# SERVICE URLS (base - override en perfiles)
# =============================
user-service:
  url: http://localhost:8080

role-service:
  url: http://localhost:8080

technology-service:
  url: http://localhost:8080

# =============================
# OPENAPI/SWAGGER DOCUMENTATION
# =============================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    enabled: ${SWAGGER_ENABLED:true}
    disable-swagger-default-url: true

# =============================
# JWT TOKEN EXPIRATION CONFIG
# =============================
jwt:
  access-token:
    expiration: 3600
  refresh-token:
    expiration: 604800
