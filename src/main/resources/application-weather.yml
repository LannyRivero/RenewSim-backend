spring:
  config:
    activate:
      on-profile: weather-enabled

# ============================================================
#  WEATHER SERVICE (OpenWeatherMap Integration)
# ============================================================
services:
  weather:
    # 🌍 Base URL del servicio de clima
    url: https://api.openweathermap.org
    # 🔐 API Key que se obtiene desde variable de entorno
    # Si no está definida, usa "dummy-key" como valor por defecto
    key: ${OPENWEATHER_API_KEY:dummy-key}

# ============================================================
# 🧩 LOGGING (para depuración opcional)
# ============================================================
logging:
  level:
    com.renewsim.backend.simulation_service.infrastructure.external: DEBUG
    com.renewsim.backend.simulation_service.application.service: INFO

# ============================================================
# ⚙️ CUSTOM CONFIG (solo si usas un adaptador)
# ============================================================
weather:
  enabled: true
  provider: openweathermap
  units: metric   # 'metric' (°C), 'imperial' (°F)
  refresh-interval: 3600  # segundos entre recalculados (si se programan)

simulation:
  climate:
    provider: openweathermap

