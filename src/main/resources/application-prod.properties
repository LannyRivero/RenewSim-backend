# =============================
# DATASOURCE (PostgreSQL - PaaS/Render)
# =============================
spring:
  datasource:
    # Opción A (recomendada): construir URL con variables de entorno específicas
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST}:${SPRING_DATASOURCE_PORT}/${SPRING_DATASOURCE_DB}?sslmode=require
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      keepalive-time: 150000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

# =============================
# SERVER / Proxy / Compression
# =============================
server:
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript

# =============================
# LOGGING (prod)
# Nota: si usas logback-spring.xml, los patterns definidos ahí gobiernan.
# =============================
logging:
  level:
    org.springframework.security: WARN
    AUTH_AUDIT: WARN
  # pattern:
  #   level: "%5p [corr=%X{correlationId}]"

# =============================
# ACTUATOR (exposición mínima)
# =============================
management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      probes:
        enabled: true

# =============================
# JWT (HS256)
# =============================
security:
  jwt:
    issuer: renewsim-auth
    audience: renewsim-app
    secret-base64: ${JWT_SECRET_BASE64}      # obligatorio en prod (>=32B reales antes de Base64)
    expiration-seconds: 3600
    not-before-skew-seconds: 0
    allowed-clock-skew-seconds: 60

  # =============================
  # RATE LIMITING (Brute-force guard)
  # =============================
  rate-limiting:
    enabled: true
    strategy: IP_USER
    max-attempts: 10
    window-seconds: 60
    retry-after-seconds: 60
    login-path: /api/v1/auth/login

# =============================
# CORS (dominios permitidos en prod)
# =============================
cors:
  enabled: true
  # Opción A: fija una lista
  allowed-origins:
    - https://renewsim.example.com
  # Opción B: usa una env con valores separados por coma (si tu binder los parsea)
  # allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods: [ "GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS" ]
  allowed-headers: [ "Content-Type", "Authorization", "X-Requested-With", "X-Correlation-Id" ]
  exposed-headers: [ "X-Correlation-Id" ]
  allow-credentials: true
  max-age-seconds: 3600







