########################################
# SERVER (Render)
########################################
server.port=${PORT:8080}
server.address=0.0.0.0

########################################
# DATASOURCE (PostgreSQL - Render)
########################################
spring.datasource.url=jdbc:postgresql://${SPRING_DATASOURCE_HOST:${PGHOST}}:${SPRING_DATASOURCE_PORT:${PGPORT:5432}}/${SPRING_DATASOURCE_DB:${PGDATABASE}}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

########################################
# JPA / Hibernate
########################################
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

########################################
# HikariCP (Pool)
########################################
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=150000

########################################
# JWT (lo que bindea tu SecurityJwtProperties)
########################################
security.jwt.issuer=${SECURITY_JWT_ISSUER:renewsim-auth}
security.jwt.audience=${SECURITY_JWT_AUDIENCE:renewsim-app}
security.jwt.secret-base64=${SECURITY_JWT_SECRET_BASE64:${JWT_SECRET_BASE64:${JWT_SECRET}}}
security.jwt.expiration-seconds=${SECURITY_JWT_EXPIRATION_SECONDS:3600}
security.jwt.not-before-skew-seconds=${SECURITY_JWT_NOT_BEFORE_SKEW_SECONDS:0}
security.jwt.allowed-clock-skew-seconds=${SECURITY_JWT_ALLOWED_CLOCK_SKEW_SECONDS:60}

# (Compat con tu config anterior por si algo antiguo aún la lee)
jwt.secret=${JWT_SECRET:${SECURITY_JWT_SECRET_BASE64}}
jwt.expiration=${JWT_EXPIRATION_MILLIS:3600000}

########################################
# LOGGING
########################################
logging.level.org.springframework.security=INFO

