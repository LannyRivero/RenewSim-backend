spring:
  config:
    import: classpath:application-prod.yml

security:
  jwt:
    issuer: ${SECURITY_JWT_ISSUER:renewsim-auth-stage}
    audience: ${SECURITY_JWT_AUDIENCE:renewsim-app-stage}
    secret-base64: ${SECURITY_JWT_SECRET_BASE64}

logging:
  level:
    root: INFO
    com.renewsim: INFO

demo:
  bootstrap:
    enabled: ${DEMO_BOOTSTRAP_ENABLED:true}
    password: ${DEMO_BOOTSTRAP_PASSWORD:DemoPass123!}
