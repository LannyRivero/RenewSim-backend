# =============================
# PERFIL LOCAL - Desarrollo en máquina local
# =============================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/renewsim?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    schemas: renewsim

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: never

# =============================
# SERVER
# =============================
server:
  port: 8080
  forward-headers-strategy: framework

# =============================
# LOGGING
# =============================
logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    com.renewsim: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG

# =============================
# JWT CONFIG
# =============================
security:
  jwt:
    issuer: renewsim-auth-local
    audience: renewsim-app-local
    secret-base64: kWlPmDQojxCrr3SNIAKVrFEk80KAH7gYJp+H6QeB4mxsQYitsTnUqCawyVQRXnMVyZ/ej6/0YhA1v+c94kMt4A==
    expiration-seconds: 3600
    service-expiration-seconds: 300
    not-before-skew-seconds: 0
    allowed-clock-skew-seconds: 60
  rate-limiting:
    enabled: true
    strategy: IP_USER
    max-attempts: 5
    window: 60s
    retry-after: 60s
    login-path: /api/v1/auth/login
    refresh-path: /api/v1/auth/refresh

# =============================
# APP CONFIG
# =============================
app:
  frontend:
    url: http://localhost:3000
  email:
    verification:
      expiration-hours: 48

# =============================
# EMAIL BREVO
# =============================
email:
  brevo:
    api-key: ${BREVO_API_KEY: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}
    sender-email: noreply@renewsim.com
    sender-name: RenewSim

# =============================
# CORS
# =============================
cors:
  enabled: true
  allow-credentials: true
  allowed-origins:
    - http://localhost:*
    - http://127.0.0.1:*
    - https://localhost:*
  allowed-methods: [ "GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS" ]
  allowed-headers:
    - Authorization
    - Content-Type
    - Accept
    - Origin
    - X-Requested-With
    - X-Correlation-Id
  exposed-headers:
    - X-Correlation-Id
    - Authorization
    - Location
  max-age-seconds: 3600

# =============================
# ACTUATOR
# =============================
management:
  endpoints:
    web:
      exposure:
        include: "health,info,flyway,metrics,prometheus"
