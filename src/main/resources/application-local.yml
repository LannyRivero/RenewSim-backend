# =============================
# PERFIL LOCAL - Desarrollo en máquina local
# Requirement: 19.1 - datasource localhost:3306, logging DEBUG, Flyway enabled
# =============================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/renewsim?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none  # Flyway maneja el schema
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # =============================
  # FLYWAY (enabled en local)
  # =============================
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    schemas: renewsim

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: never  # Flyway maneja las migraciones

# =============================
# SERVER
# =============================
server:
  port: 8080
  forward-headers-strategy: framework

# =============================
# LOGGING (DEBUG en local)
# =============================
logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    com.renewsim: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG

# =============================
# JWT (dev keys)
# =============================
security:
  jwt:
    issuer: renewsim-auth-local
    audience: renewsim-app-local
    secret-base64: ${JWT_SECRET_BASE64:zAVmvhHflK1UXkKFMhSyE0SFycA5KDgv9rsjn/oHPDIhCS/40msmI7BVMY7kiwH13ewupe6GWShM75XnYimtaQ==}
    expiration-seconds: 3600
    service-expiration-seconds: 300
    not-before-skew-seconds: 0
    allowed-clock-skew-seconds: 60

  rate-limiting:
    enabled: true
    strategy: IP_USER
    max-attempts: 5
    window: 60s
    retry-after: 60s
    login-path: /api/v1/auth/login/step1
    refresh-path: /api/v1/auth/refresh

# =============================
# CORS (permisivo en local)
# =============================
cors:
  enabled: true
  allow-credentials: true
  allowed-origins:
    - http://localhost:*
    - http://127.0.0.1:*
    - https://localhost:*
  allowed-methods: [ "GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS" ]
  allowed-headers:
    - Authorization
    - Content-Type
    - Accept
    - Origin
    - X-Requested-With
    - X-Correlation-Id
  exposed-headers:
    - X-Correlation-Id
    - Authorization
    - Location
  max-age-seconds: 3600

# =============================
# ACTUATOR (completo en local)
# =============================
management:
  endpoints:
    web:
      exposure:
        include: "health,info,flyway,metrics"