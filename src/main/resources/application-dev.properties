# =============================
# DATASOURCE (MySQL Local)
# =============================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/renewsim?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      # leak-detection-threshold: 20000   # (optional for debugging)
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# =============================
# SERVER (headers, proxy, etc.)
# =============================
server:
  forward-headers-strategy: framework

# =============================
# LOGGING (dev)
# If you use logback-spring.xml, this section’s pattern.* is ignored
# Keep levels here for convenience
# =============================
logging:
  level:
    org.springframework.security: DEBUG
    AUTH_AUDIT: INFO
  # pattern:
  #   level: "%5p [corr=%X{correlationId}]"

# =============================
# JWT (aligned with SecurityJwtProperties)
# =============================
security:
  jwt:
    issuer: renewsim-auth-dev
    audience: renewsim-app-dev
    # Prefer base64 in dev; real value comes from env var if provided
    secret-base64: ${JWT_SECRET_BASE64:VGhpcy1pcy1hLWRldmVsb3BtZW50LXNlY3JldC1zaG91bGQtYmUtMzItY2hhcmFjdGVycy1sb25nIQ==}
    # secret: ${JWT_SECRET_PLAINTEXT:0123456789abcdef0123456789abcdef} # alternative (>=32B), comment out by default
    expiration-seconds: 3600
    not-before-skew-seconds: 0
    allowed-clock-skew-seconds: 60

  # =============================
  # RATE LIMITING (Brute-force guard)
  # =============================
  rate-limiting:
    enabled: true
    strategy: IP_USER
    max-attempts: 3
    window-seconds: 15
    retry-after-seconds: 15
    login-path: /api/v1/auth/login

# =============================
# CORS (centralized)
# =============================
cors:
  enabled: true
  allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
  allowed-methods: [ "GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS" ]
  allowed-headers: [ "Content-Type", "Authorization", "X-Requested-With", "X-Correlation-Id" ]
  exposed-headers: [ "X-Correlation-Id" ]
  allow-credentials: true
  max-age-seconds: 3600

# =============================
# ACTUATOR (dev)
# =============================
management:
  endpoints:
    web:
      exposure:
        include: "health,info"



