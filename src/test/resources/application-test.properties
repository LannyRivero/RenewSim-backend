# =============================
# H2 in-memory (test)
# =============================
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true            # igual que tu .properties (true)
    database-platform: org.hibernate.dialect.H2Dialect

# =============================
# CORS (test)
# =============================
cors:
  allowed-origins:
    - http://localhost
    - http://localhost:3000
    - http://localhost:5173

# =============================
# JWT (test)
# =============================
security:
  jwt:
    issuer: renewsim-test
    audience: renewsim-clients
    # usa UNA de las dos; preferible base64 en test para estabilidad
    secret-base64: c2VjdXJlX3Rlc3Rfc2VjcmV0X2tleV8zMmJ5dGVzX2Jhc2U2NA==
    # secret: super-secure-plain-secret-at-least-32-chars
    expiration-seconds: 3600
    not-before-skew-seconds: 0
    allowed-clock-skew-seconds: 60

  # =============================
  # RATE LIMITING (test)
  # =============================
  rate-limiting:
    enabled: true
    strategy: IP
    max-attempts: 3
    window-seconds: 10
    # si tu filtro usa estos campos, añade (opcionales):
    # retry-after-seconds: 10
    # login-path: /api/v1/auth/login






