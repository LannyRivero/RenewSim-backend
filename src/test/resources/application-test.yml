# =============================
# H2 In-Memory Database
# =============================
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  # =============================
  # Flyway (DISABLED in tests)
  # =============================
  flyway:
    enabled: false
    
  # =============================
  # JPA / Hibernate
  # =============================
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  
  # =============================
  # Cache
  # =============================
  cache:
    type: none

# =============================
# SECURITY CONFIGURATION
# =============================
security:
  jwt:
    issuer: renewsim-test
    audience: renewsim-clients
    secret-base64: QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQQ==
    expiration-seconds: 3600
    not-before-skew-seconds: 0
    allowed-clock-skew-seconds: 60
  
  rate-limiting:
    enabled: false

# =============================
# CORS
# =============================
cors:
  enabled: true
  allowed-origins: http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: Content-Type,Authorization,X-Requested-With,X-Correlation-Id
  exposed-headers: X-Correlation-Id
  allow-credentials: true
  max-age-seconds: 3600

# =============================
# ACTUATOR
# =============================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# =============================
# LOGGING
# =============================
logging:
  level:
    root: WARN
    org.springframework: INFO
    org.hibernate: WARN
    com.renewsim.backend: DEBUG
    com.renewsim.backend.user_service.application.service: WARN
    org.testcontainers: WARN
    org.testcontainers.utility.ResourceReaper: ERROR

# =============================
# TEST EXCLUSIONS
# =============================
test:
  exclude:
    groups: integration,security-config,docker
